name: Bump

# Checks for a new fetchart release and updates Formula/fetchart.rb once both the
# PyPI sdist and the GitHub release exe are published.
on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Check for a new release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/bump_fetchart.py Formula/fetchart.rb
      - name: Commit and push
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/fetchart.rb
          git commit -m "fetchart ${{ steps.bump.outputs.version }}"
          git push

  test:
    needs: bump
    if: needs.bump.outputs.bumped == 'true'
    uses: ./.github/workflows/tests.yml
