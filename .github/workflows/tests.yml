name: Tests

# Installs and tests every formula with real Homebrew on macOS and Linux.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by bump.yml after an automatic bump (pushes made with GITHUB_TOKEN don't trigger push events).
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        formula: [fetchart, fetchamiibo]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew install --verbose samuelarther/tap/${{ matrix.formula }}
      - run: brew test samuelarther/tap/${{ matrix.formula }}
      - run: ${{ matrix.formula }} --help
      - run: brew audit --online samuelarther/tap/${{ matrix.formula }}
